                                                    <div className="bg-black/60 backdrop-blur-sm text-white text-[10px] px-2 py-1 rounded-md flex items-center gap-1"><div className="w-3 h-3">{getCategoryLabel(item.category).icon}</div>{item.subCategory || getCategoryLabel(item.category).text}</div>
                                                    {item.brand && <div className="bg-white/90 text-gray-700 text-[9px] px-2 py-0.5 rounded-md font-bold shadow-sm">{item.brand}</div>}
                                                    {item.tags && item.tags.length > 0 && (<div className="flex flex-wrap gap-1">{item.tags.slice(0, 3).map(tag => (<div key={tag} className="bg-purple-100 text-purple-700 text-[9px] px-1.5 py-0.5 rounded-md shadow-sm">#{tag}</div>))}</div>)}
                                                </div>
                                                <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-3 pt-6"><p className="text-white text-xs font-medium truncate">{item.name}</p></div>
                                                <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity"><button onClick={(e) => { e.stopPropagation(); handleEditItem(item); }} className="bg-white text-slate-600 p-1.5 rounded-full hover:bg-slate-50 shadow-sm"><div className="w-3 h-3"><Icons.Edit /></div></button><button onClick={(e) => { e.stopPropagation(); handleDelete(item.id, 'cloth'); }} className="bg-white text-red-500 p-1.5 rounded-full hover:bg-red-50 shadow-sm"><div className="w-3 h-3"><Icons.Trash /></div></button></div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-3 pb-10">
                                        {clothes.filter(item => {
                                            const catMatch = viewCategory === 'all' || item.category === viewCategory;
                                            const subMatch = viewSubCategory === 'all' || item.subCategory === viewSubCategory;
                                            const brandMatch = viewBrand === 'all' || item.brand === viewBrand;
                                            const tagMatch = viewTag === 'all' || (item.tags && item.tags.includes(viewTag));
                                            return catMatch && subMatch && brandMatch && tagMatch;
                                        }).map(item => (<ListViewItem key={item.id} item={item} type="cloth" onDelete={handleDelete} onEdit={handleEditItem} />))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'user' && (<div className="animate-fade-in"><div className="flex justify-between items-center mb-6"><h2 className="text-lg font-semibold">模特兒管理</h2><div className="flex gap-2"><button onClick={() => setViewMode(viewMode === 'grid' ? 'list' : 'grid')} className="p-2 bg-white rounded-lg text-gray-600 hover:bg-gray-100 border border-gray-200"><div className="w-5 h-5">{viewMode === 'grid' ? <Icons.List /> : <Icons.Grid />}</div></button><button onClick={() => fileInputRefUser.current.click()} className="flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-full text-sm hover:bg-slate-800"><div className="w-4 h-4"><Icons.Camera /></div> 上傳照片</button><input type="file" ref={fileInputRefUser} className="hidden" accept="image/*" onChange={(e) => handleFileSelect(e, 'user')} /></div></div>{viewMode === 'grid' ? (<div className="grid grid-cols-2 md:grid-cols-3 gap-4 pb-10">{users.map((item) => (<div key={item.id} className="group relative aspect-[3/4] bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm"><img src={item.src} onError={handleImageError} className="w-full h-full object-cover" /><div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-2 text-white text-xs font-bold">{item.name || "我"}</div><div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity"><button onClick={() => handleRenameModel(item.id, item.name)} className="bg-white text-slate-600 p-1.5 rounded-full hover:bg-slate-50 shadow-sm"><div className="w-3 h-3"><Icons.Edit /></div></button><button onClick={() => handleDelete(item.id, 'user')} className="bg-white text-red-500 p-1.5 rounded-full hover:bg-red-50 shadow-sm"><div className="w-3 h-3"><Icons.Trash /></div></button></div></div>))}</div>) : (<div className="flex flex-col gap-3 pb-10">{users.map(item => (<ListViewItem key={item.id} item={item} type="user" onDelete={handleDelete} onEdit={() => handleRenameModel(item.id, item.name)} />))}</div>)}</div>)}
                        
                        {activeTab === 'studio' && (<div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 animate-fade-in mb-10"><div className="flex flex-col lg:flex-row gap-8 justify-center items-start"><div className="w-full lg:w-1/3"><h3 className="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">1. 選擇模特兒</h3><div className="grid grid-cols-3 gap-2">{users.map(u => (<div key={u.id} onClick={() => setSelectedUser(u)} className={`aspect-[3/4] rounded-lg overflow-hidden cursor-pointer border-2 transition-all ${selectedUser?.id === u.id ? 'border-purple-500 ring-2 ring-purple-200' : 'border-transparent opacity-70 hover:opacity-100'}`}><img src={u.src} className="w-full h-full object-cover" /></div>))}</div></div>
                            <div className="w-full lg:w-2/3">
                                {/* 新增按鈕區：動態增加欄位 */}
                                <div className="flex justify-between items-end mb-3">
                                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider">2. 選擇搭配</h3>
                                    <div className="flex gap-2">
                                        <button onClick={() => handleAddSlot('upper', '上身')} className="px-2 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded hover:bg-purple-100 flex items-center gap-1"><div className="w-3 h-3"><Icons.Plus /></div> 上身</button>
                                        <button onClick={() => handleAddSlot('lower', '下身')} className="px-2 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded hover:bg-purple-100 flex items-center gap-1"><div className="w-3 h-3"><Icons.Plus /></div> 下身</button>
                                        <button onClick={() => handleAddSlot('accessory', '配件')} className="px-2 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded hover:bg-purple-100 flex items-center gap-1"><div className="w-3 h-3"><Icons.Plus /></div> 配件</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {/* 使用 tryOnSlots 狀態來渲染欄位 */}
                                    {tryOnSlots.map(slot => (
                                        <div key={slot.id} onClick={() => { setCurrentSelectionSlot(slot.id); setIsSelectorOpen(true); }} className={`group relative h-32 rounded-xl border-2 border-dashed flex flex-col items-center justify-center cursor-pointer transition-all hover:bg-gray-50 ${selectedItems[slot.id] ? 'border-purple-500 bg-purple-50' : 'border-gray-300'}`}>
                                            {selectedItems[slot.id] ? (
                                                <div className="relative w-full h-full p-2">
                                                    <img src={selectedItems[slot.id].src} className="w-full h-full object-contain" />
                                                    <button onClick={(e) => { e.stopPropagation(); setSelectedItems(p => ({...p, [slot.id]: null})); }} className="absolute top-1 right-1 bg-white text-gray-500 rounded-full p-1 shadow-md hover:text-red-500"><div className="w-3 h-3"><Icons.X /></div></button>
                                                    <span className="absolute bottom-1 left-0 right-0 text-[10px] text-center text-purple-700 font-bold bg-white/80">{selectedItems[slot.id].name || slot.label}</span>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="w-6 h-6 text-gray-300 mb-1">{getCategoryLabel(slot.category).icon}</div>
                                                    <span className="text-xs text-gray-400">{slot.label}</span>
                                                    {/* 刪除按鈕 (僅針對後來新增的欄位，這裡判斷如果是預設的幾個基本欄位則不顯示，簡單起見可全部允許或判斷 ID) */}
                                                    {slot.id.includes('_') && (
                                                        <button onClick={(e) => { e.stopPropagation(); handleRemoveSlot(slot.id); }} className="absolute top-1 right-1 text-gray-300 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity"><div className="w-3 h-3"><Icons.X /></div></button>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div><div className="mt-8 bg-gray-50 p-4 rounded-xl border border-gray-100"><h3 className="text-sm font-bold text-gray-600 mb-3 flex items-center gap-2"><div className="w-4 h-4"><Icons.Settings /></div> 生成設定</h3><div className="flex flex-col gap-4"><div className="flex bg-white p-1 rounded-lg border border-gray-200"><button onClick={() => setFocusMode('full')} className={`flex-1 py-2 text-xs font-bold rounded-md transition-all flex items-center justify-center gap-2 ${focusMode === 'full' ? 'bg-slate-800 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-100'}`}><div className="w-4 h-4"><Icons.Body /></div> 全身服飾</button><button onClick={() => setFocusMode('face')} className={`flex-1 py-2 text-xs font-bold rounded-md transition-all flex items-center justify-center gap-2 ${focusMode === 'face' ? 'bg-slate-800 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-100'}`}><div className="w-4 h-4"><Icons.Eye /></div> 臉部髮型特寫</button></div><div className="flex gap-2">{[{ id: 'studio', label: '✨ 標準棚拍' }, { id: 'minimal', label: '🛡️ 最小變化' }, { id: 'custom', label: '✏️ 自訂指令' }].map(mode => (<button key={mode.id} onClick={() => setGenMode(mode.id)} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${genMode === mode.id ? 'bg-white shadow-sm border border-purple-200 text-purple-700' : 'text-gray-500 hover:bg-gray-200'}`}>{mode.label}</button>))}</div>{genMode === 'custom' && (<textarea value={customPromptText} onChange={(e) => setCustomPromptText(e.target.value)} placeholder="輸入自訂場景..." className="w-full p-3 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-purple-200 outline-none resize-none h-20" />)}<p className="text-xs text-gray-400 pl-1">{focusMode === 'face' ? '💡 特寫模式：AI 將專注於融合髮型與臉部，忽略下半身穿搭。' : '💡 全身模式：展示整體穿搭效果，包含鞋子。'}</p></div></div><div className="mt-6 flex justify-center"><button disabled={!selectedUser || isGenerating} onClick={handleGenerateClick} className={`px-10 py-4 rounded-full font-bold text-lg shadow-xl w-full md:w-auto flex items-center justify-center gap-2 transition-transform active:scale-95 ${!selectedUser ? 'bg-gray-200 text-gray-400' : 'bg-gradient-to-r from-purple-600 to-pink-500 text-white hover:shadow-purple-500/30'}`}>{isGenerating ? <><div className="w-5 h-5"><Icons.Loader /></div> 處理中...</> : <><div className="w-5 h-5"><Icons.Sparkles /></div> 生成試穿照</>}</button></div>{(generatedResult || errorMsg) && (<div className="mt-8 pt-8 border-t border-gray-100 flex flex-col items-center animate-slide-up">{errorMsg ? <div className="p-4 bg-red-50 text-red-600 rounded-xl text-center border border-red-100">{errorMsg}</div> : <div className="flex flex-col items-center gap-4 w-full"><h3 className="font-bold text-gray-700">生成結果</h3><img src={generatedResult} className="rounded-xl shadow-2xl w-full max-w-sm cursor-zoom-in" onClick={() => setZoomImageSrc(generatedResult)} /><div className="flex gap-3"><button onClick={() => handleDownload(generatedResult, `tryon-${Date.now()}.jpg`)} className="px-6 py-2 bg-gray-100 hover:bg-gray-200 rounded-full text-sm font-bold flex items-center gap-2 transition-colors"><div className="w-4 h-4"><Icons.Download /></div> 下載</button><button onClick={handleSaveLook} className="px-6 py-2 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-full text-sm font-bold flex items-center gap-2 transition-colors"><div className="w-4 h-4"><Icons.SaveHeart /></div> 保存到日誌</button></div></div>}</div>)}</div>)}
                        
                        {activeTab === 'lookbook' && (<div className="animate-fade-in"><div className="flex justify-between items-center mb-6"><h2 className="text-lg font-semibold">穿搭日誌</h2><button onClick={() => setViewMode(viewMode === 'grid' ? 'list' : 'grid')} className="p-2 bg-white rounded-lg text-gray-600 hover:bg-gray-100 border border-gray-200"><div className="w-5 h-5">{viewMode === 'grid' ? <Icons.List /> : <Icons.Grid />}</div></button></div>{looks.length === 0 ? <div className="text-center py-20 text-gray-400 bg-white rounded-2xl border-2 border-dashed border-gray-200"><div className="w-16 h-16 mx-auto mb-4 opacity-20"><Icons.BookHeart /></div><p>還沒有保存的穿搭</p></div> : (viewMode === 'grid' ? <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">{looks.map((look) => (<div key={look.id} onClick={() => setSelectedLook(look)} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-shadow"><div className="relative aspect-[3/4] bg-gray-50 group"><img src={look.src} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center"><span className="opacity-0 group-hover:opacity-100 bg-white/90 text-gray-700 text-xs px-3 py-1.5 rounded-full font-bold shadow-sm">查看詳情</span></div></div><div className="p-4 flex justify-between items-center bg-white border-t border-gray-50"><span className="text-xs text-gray-400">{look.createdAt ? new Date(look.createdAt.seconds * 1000).toLocaleDateString() : '剛剛'}</span><button onClick={(e) => { e.stopPropagation(); handleDelete(look.id, 'look'); }} className="text-red-400 hover:text-red-600 p-1.5 rounded-full hover:bg-red-50"><div className="w-4 h-4"><Icons.Trash /></div></button></div></div>))}</div> : <div className="flex flex-col gap-3 pb-10">{looks.map(look => <LookListViewItem key={look.id} look={look} onDelete={handleDelete} onRename={handleRenameLook} onSelect={setSelectedLook} />)}</div>)}</div>)}
                        
                        {/* 修正選擇器 (Selector)：使用 tryOnSlots 尋找對應的分類 */}
                        {isSelectorOpen && (<div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm" onClick={() => setIsSelectorOpen(false)}><div className="bg-white w-full md:w-[600px] h-[70vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden m-4" onClick={e => e.stopPropagation()}><div className="p-4 border-b flex justify-between items-center bg-gray-50"><h3 className="font-bold">選擇{tryOnSlots.find(s => s.id === currentSelectionSlot)?.label || '物品'}</h3><button onClick={() => setIsSelectorOpen(false)}><div className="w-6 h-6"><Icons.X /></div></button></div><div className="flex-1 overflow-y-auto p-4 bg-white">
                            {(() => {
                                const targetCategory = tryOnSlots.find(s => s.id === currentSelectionSlot)?.category || currentSelectionSlot;
                                const filteredClothes = clothes.filter(c => c.category === targetCategory);
                                
                                if (filteredClothes.length === 0) return <div className="h-full flex flex-col items-center justify-center text-gray-400 gap-2"><p>沒有這個分類的物品</p><button onClick={() => { setIsSelectorOpen(false); setIsUploadModalOpen(true); }} className="text-purple-600 font-bold">去新增</button></div>;
                                
                                return <div className="grid grid-cols-3 gap-3">{filteredClothes.map(item => (<div key={item.id} onClick={() => { setSelectedItems(p => ({...p, [currentSelectionSlot]: item})); setIsSelectorOpen(false); }} className="cursor-pointer aspect-square bg-white rounded-xl border-2 border-transparent hover:border-purple-500 overflow-hidden shadow-sm relative"><img src={item.src} className="w-full h-full object-cover" /><div className="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] p-1 truncate">{item.name}</div></div>))}</div>;
                            })()}
                        </div></div></div>)}
                        
                        {showSettings && <SettingsModal onClose={() => setShowSettings(false)} user={user} isFirebaseReady={isFirebaseReady} apiKey={globalApiKey} onSaveApiKey={saveApiKeyToCloud} genStats={genStats} onRedeem={handleRedeem} userBrands={userBrands} onDeleteBrand={handleDeleteUserBrand} userTags={userTags} onDeleteTag={handleDeleteUserTag} />}
                        {isUploadModalOpen && <UploadEditorModal isOpen={isUploadModalOpen} onClose={() => setIsUploadModalOpen(false)} file={uploadFile} isEdit={!!editingItem} initialData={editingItem} onConfirm={handleConfirmUpload} userTags={userTags} onAddTag={handleAddUserTag} onDeleteTag={handleDeleteUserTag} userBrands={userBrands} onAddBrand={handleAddUserBrand} defaultCategory={viewCategory} />}
                        {selectedLook && <LookDetailsModal isOpen={!!selectedLook} onClose={() => setSelectedLook(null)} look={selectedLook} lookName={selectedLook.name} onRename={handleRenameLook} onRestore={handleRestoreLook} />}
                        {zoomImageSrc && <ImageZoomModal src={zoomImageSrc} onClose={() => setZoomImageSrc(null)} />}
                    </main>
                    <footer className="py-6 text-center text-gray-400 text-xs">Created by weic58 and Google Gemini, 2026</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VirtualWardrobe />);
    </script>
</body>
</html>
