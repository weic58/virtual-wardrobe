            return new Promise((resolve) => {
                const img = new Image();

                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }

        const generateTryOnImage = async (userImage, selectedItems, apiKey, mode = 'studio', customPrompt = '', focusMode = 'full', activeSlots = [], onDebugPrompt) => {
            if (!apiKey) throw new Error("請在設定中輸入 API Key");
            
            let promptText = "這是一項虛擬試穿任務。第一張圖片是'使用者' (模特兒)。";
            
            const imageParts = [];
            // 第一次放入使用者 (身體參考)
            imageParts.push({ inlineData: { mimeType: "image/jpeg", data: userImage.split(',')[1] } });
            
            let clothIndex = 2;

            activeSlots.forEach(slot => {
                const item = selectedItems[slot.id];
                if (item) {
                    let label = "衣物配件"; 
                    if (slot.category === 'hairstyle') label = "髮型參考";
                    
                    promptText += ` 第 ${clothIndex} 張圖片是'${label}'。`;
                    imageParts.push({ inlineData: { mimeType: "image/jpeg", data: item.src.split(',')[1] } });
                    clothIndex++;
                }
            });

            // 臉部重注策略 (保持這個以維持臉部穩定)
            promptText += ` 第 ${clothIndex} 張圖片是'臉部五官特寫參考'。`;
            imageParts.push({ inlineData: { mimeType: "image/jpeg", data: userImage.split(',')[1] } });
            
            promptText += " 請生成一張高品質、寫實的照片，顯示'使用者'穿著上述選定的衣物/配件。";
            
            // [核心指令區] - 不論什麼模式都要遵守的物理規則
            promptText += " [絕對規則]：";
            promptText += " 1. 【臉部鎖定】：臉部五官必須與第 1 張及最後一張圖片完全一致，不可改變長相。";
            
            if (focusMode === 'face') {
                promptText += " 2. 【特寫模式】：請生成半身或頭像特寫，重點在展示臉部與上半身搭配。";
            } else {
                promptText += " 2. 【全身模式】：請盡量展示全身或七分身穿搭。";
            }

            // [風格/場景分支] - 根據您的要求徹底分流
            if (mode === 'custom') {
                // === 自訂模式 ===
                // 完全覆蓋：不加任何預設背景、表情、姿勢指令，完全聽從 customPrompt
                if (customPrompt) {
                    promptText += ` 3. 【自訂指令】：${customPrompt}`;
                } else {
                    promptText += ` 3. 背景與風格：請保持自然寫實。`; // 若使用者選自訂卻沒打字，給個最基本的兜底
                }

            } else if (mode === 'minimal') {
                // === 最小變化模式 ===
                // 重點是「不動背景」
                promptText += " 3. 【最小變化】：請嚴格保留原圖(第1張)的背景環境、光影氛圍與身體姿勢，僅替換衣物。";
                promptText += " 4. 表情：保持原圖表情。";

            } else {
                // === 棚拍模式 (Studio) - 預設 ===
                // 重點是「白背景」+「好看的模特圖」
                promptText += " 3. 【棚拍風格】：背景必須替換為'純白色攝影棚背景' (Pure White Studio Background)。";
                promptText += " 4. 光影：使用專業攝影棚打光 (Studio Lighting)。";
                promptText += " 5. 姿勢：模特兒請呈現'正面全身'。";
                promptText += " 6. 表情：面帶柔和微笑但不露齒。";
            }

            if (onDebugPrompt) {
                onDebugPrompt(promptText);
            }

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }, ...imageParts] }],
                            generationConfig: { responseModalities: ["IMAGE"], temperature: 0.4 },
                            safetySettings: [
                                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                            ]
                        }),
                    }
                );
                
                const data = await response.json();
                
                if (data.error) throw new Error(`API Error: ${data.error.message}`);
                const candidate = data.candidates?.[0];
                if (candidate?.finishReason === 'SAFETY') throw new Error("⚠️ 圖片被安全系統攔截：請更換照片。");
                if (candidate?.content?.parts) {
                    const imagePart = candidate.content.parts.find(p => p.inlineData);
                    if (imagePart) return `data:image/jpeg;base64,${imagePart.inlineData.data}`;
                }
                throw new Error("生成失敗：模型拒絕產生圖片");
            } catch (error) {
                console.error("Gemini API Error:", error);
                throw error;
            }
        };

        // --- Settings Modal ---
        const SettingsModal = ({ onClose, user, isFirebaseReady, apiKey, onSaveApiKey, genStats, onRedeem, userBrands = [], onDeleteBrand, userTags = [], onDeleteTag }) => {
            const [inputKey, setInputKey] = useState(apiKey || '');
            const [redeemCode, setRedeemCode] = useState('');
            const [msg, setMsg] = useState('');
            const [redeemMsg, setRedeemMsg] = useState('');

            const handleLogout = async () => {
                if (confirm("確定要登出嗎？")) {
                    await window.Firebase.signOut(window.Firebase.getAuth());
                    window.location.reload();
                }
            };

            const handleSaveKey = () => {
                onSaveApiKey(inputKey);
                setMsg('✅ 儲存成功');
                setTimeout(() => setMsg(''), 2000);
            };

            const handleRedeemClick = async () => {
                if (!redeemCode.trim()) return;
                const success = await onRedeem(redeemCode);
                if (success) {
                    setRedeemMsg('✅ 成功增加 5 次額度！');
                    setRedeemCode('');
                } else {
                    setRedeemMsg('❌ 代碼無效');
                }
                setTimeout(() => setRedeemMsg(''), 3000);
            };

            const getAvatarText = () => {
                if (user.displayName) return user.displayName[0].toUpperCase();
                if (user.email) return user.email[0].toUpperCase();
                return "A";
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/50 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm max-h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col m-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center p-6 border-b">
                            <h3 className="font-bold text-lg flex items-center gap-2"><div className="w-5 h-5 text-slate-500"><Icons.Settings /></div> 設定</h3>
                            <button onClick={onClose}><div className="w-5 h-5"><Icons.X /></div></button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto space-y-6">
                            {user && (
                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="w-10 h-10 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center font-bold text-lg overflow-hidden">
                                            {user.photoURL ? <img src={user.photoURL} className="w-full h-full object-cover" /> : getAvatarText()}
                                        </div>
                                        <div className="overflow-hidden">
                                            <p className="font-bold text-gray-800 truncate">{user.displayName || (user.isAnonymous ? "訪客" : "使用者")}</p>
                                            <p className="text-xs text-gray-500 truncate">{user.email || "未綁定 Email"}</p>
                                            <p className="text-[10px] text-gray-400 font-mono truncate">UID: {user.uid}</p>
                                        </div>
                                    </div>
                                    <div className="text-xs text-gray-500 flex justify-between items-center mt-2 bg-white p-2 rounded border">
                                        <span>額度使用:</span>
                                        <span className={`font-bold ${genStats.count >= genStats.limit ? 'text-red-500' : 'text-green-600'}`}>
                                            {genStats.count} / {genStats.limit}
                                        </span>
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">輸入代碼加值</label>
                                <div className="flex gap-2">
                                    <input type="text" value={redeemCode} onChange={(e) => setRedeemCode(e.target.value)} placeholder="輸入代碼" className="flex-1 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm" />
                                    <button onClick={handleRedeemClick} className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-bold hover:bg-green-700">兌換</button>
                                </div>
                                {redeemMsg && <p className="text-xs mt-1 text-center font-bold">{redeemMsg}</p>}
                                <p className="text-[10px] text-gray-400 mt-1">輸入代碼可增加 5 次生成額度。</p>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">Google Gemini API 金鑰</label>
                                <div className="flex gap-2">
                                    <input type="password" value={inputKey} onChange={(e) => setInputKey(e.target.value)} placeholder="貼上 API Key" className="flex-1 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm font-mono" />
                                    <button onClick={handleSaveKey} className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-bold hover:bg-purple-700">儲存</button>
                                </div>
                                {msg && <p className="text-xs mt-1 text-green-600">{msg}</p>}
                            </div>

                            {userBrands && userBrands.length > 0 && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">管理自訂品牌</label>
                                    <div className="flex flex-wrap gap-2">
                                        {userBrands.map(brand => (
                                            <div key={brand} className="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded flex items-center gap-1 border border-blue-100">
                                                {brand}
                                                <button onClick={() => onDeleteBrand(brand)} className="hover:text-red-500 font-bold">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {userTags && userTags.length > 0 && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">管理自訂標籤</label>
                                    <div className="flex flex-wrap gap-2">
                                        {userTags.map(tag => (
                                            <div key={tag} className="bg-purple-50 text-purple-700 text-xs px-2 py-1 rounded flex items-center gap-1 border border-purple-100">
                                                #{tag}
                                                <button onClick={() => onDeleteTag(tag)} className="hover:text-red-500 font-bold">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <button onClick={handleLogout} className="w-full py-3 bg-red-50 text-red-600 rounded-xl text-sm font-bold hover:bg-red-100 flex items-center justify-center gap-2 transition-colors"><div className="w-4 h-4"><Icons.LogOut /></div> 登出帳號</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Modified UploadEditorModal ---
        const UploadEditorModal = ({ isOpen, onClose, file, onConfirm, isEdit, initialData, userTags, onAddTag, onDeleteTag, userBrands, onAddBrand, defaultCategory }) => {
            if (!isOpen) return null;
            const [name, setName] = useState('');
            const [category, setCategory] = useState('upper');
            const [subCategory, setSubCategory] = useState('長袖');
            const [brand, setBrand] = useState('Uniqlo');
            const [customBrand, setCustomBrand] = useState('');
            const [selectedTags, setSelectedTags] = useState([]); 
            const [newTagInput, setNewTagInput] = useState('');
            const [previewUrl, setPreviewUrl] = useState('');

            const availableBrands = [...DEFAULT_BRANDS, ...(userBrands || []), '自訂'];

            // 核心功能：當開啟上傳時，自動根據目前頁籤 (defaultCategory) 設定分類
            useEffect(() => {
                if (isOpen && !isEdit && defaultCategory && defaultCategory !== 'all') {
                    if (CLOTH_CATEGORIES[defaultCategory]) {
                        setCategory(defaultCategory);
                        // 自動切換該分類的第一個子項目 (types)
                        setSubCategory(CLOTH_CATEGORIES[defaultCategory].types[0] || '其他');
                    }
                }
            }, [isOpen, defaultCategory, isEdit]);

            useEffect(() => {
                if (isEdit && initialData) {
                    setName(initialData.name || '');
                    setCategory(initialData.category || 'upper');
                    setSubCategory(initialData.subCategory || (CLOTH_CATEGORIES[initialData.category || 'upper']?.types[0] || '其他'));
                    const b = initialData.brand || 'Uniqlo';
                    if (availableBrands.includes(b) && b !== '自訂') { setBrand(b); } 
                    else { setBrand('自訂'); setCustomBrand(b); }
                    setSelectedTags(initialData.tags || []);
                    setPreviewUrl(initialData.src);
                } else if (file) {
                    const defaultName = file.name.replace(/\.[^/.]+$/, "");
                    setName(defaultName);
                    const reader = new FileReader();
                    reader.onloadend = () => setPreviewUrl(reader.result);
                    reader.readAsDataURL(file);
                }
            }, [file, isEdit, initialData, userBrands]);

            useEffect(() => {
                // 當切換分類時，自動重設子分類為該分類的第一項，避免子分類與主分類不匹配
                if (!isEdit && category) { 
                    setSubCategory(CLOTH_CATEGORIES[category]?.types[0] || '其他'); 
                }
            }, [category]);

            const handleConfirm = () => {
                let finalBrand = brand;
                if (brand === '自訂') {
                    finalBrand = customBrand.trim();
                    if (finalBrand && onAddBrand) onAddBrand(finalBrand);
                }
                onConfirm({ name, category, subCategory, brand: finalBrand, tags: selectedTags });
                onClose();
            };

            const toggleTag = (tag) => {
                if (selectedTags.includes(tag)) setSelectedTags(selectedTags.filter(t => t !== tag));
                else setSelectedTags([...selectedTags, tag]);
            };

            const handleAddNewTag = () => {
                if (newTagInput.trim()) {
                    onAddTag(newTagInput.trim());
                    if (!selectedTags.includes(newTagInput.trim())) setSelectedTags([...selectedTags, newTagInput.trim()]);
                    setNewTagInput('');
                }
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50"><h3 className="font-bold text-lg">{isEdit ? '編輯單品' : '新增單品'}</h3><button onClick={onClose}><div className="w-5 h-5 text-gray-500"><Icons.X /></div></button></div>
                        <div className="p-4 overflow-y-auto flex-1">
                            <div className="flex justify-center mb-4 bg-gray-100 rounded-lg p-2">{previewUrl && <img src={previewUrl} className="h-40 object-contain rounded-md" />}</div>
                            <div className="space-y-4">
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">名稱</label><input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-purple-500 outline-none" /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-gray-500 mb-1">分類</label><select value={category} onChange={e => setCategory(e.target.value)} className="w-full p-2 border rounded-lg text-sm bg-white">{Object.entries(CLOTH_CATEGORIES).map(([key, val]) => (<option key={key} value={key}>{val.label}</option>))}</select></div>
                                    <div><label className="block text-xs font-bold text-gray-500 mb-1">種類</label><select value={subCategory} onChange={e => setSubCategory(e.target.value)} className="w-full p-2 border rounded-lg text-sm bg-white">{CLOTH_CATEGORIES[category]?.types.map(t => (<option key={t} value={t}>{t}</option>))}</select></div>
                                </div>
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">品牌</label><div className="flex gap-2"><select value={brand} onChange={e => setBrand(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm bg-white">{availableBrands.map(b => <option key={b} value={b}>{b}</option>)}</select>{brand === '自訂' && (<input type="text" placeholder="輸入品牌" value={customBrand} onChange={e => setCustomBrand(e.target.value)} className="flex-1 p-2 border rounded-lg text-sm outline-none" />)}</div></div>
                                <div><label className="block text-xs font-bold text-gray-500 mb-1">標籤 (點擊選取)</label><div className="flex flex-wrap gap-2 mb-2">{userTags.map(tag => (<div key={tag} className={`px-2 py-1 rounded-md text-xs cursor-pointer flex items-center gap-1 border ${selectedTags.includes(tag) ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-white text-gray-600 border-gray-200'}`} onClick={() => toggleTag(tag)}><span>{tag}</span><span onClick={(e) => { e.stopPropagation(); onDeleteTag(tag); }} className="text-gray-400 hover:text-red-500 px-1 font-bold">×</span></div>))}{userTags.length === 0 && <span className="text-xs text-gray-400">尚無儲存標籤</span>}</div><div className="flex gap-2"><input type="text" value={newTagInput} onChange={(e) => setNewTagInput(e.target.value)} placeholder="新增標籤" className="flex-1 p-2 border rounded-lg text-xs outline-none" /><button onClick={handleAddNewTag} className="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold hover:bg-gray-200"><div className="w-3 h-3"><Icons.Plus /></div></button></div></div>
                            </div>
                        </div>
                        <div className="p-4 border-t bg-gray-50 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-500 text-sm font-bold hover:bg-gray-200 rounded-lg">取消</button><button onClick={handleConfirm} className="px-6 py-2 bg-slate-900 text-white text-sm font-bold rounded-lg hover:bg-slate-700">儲存</button></div>
                    </div>
                </div>
            );
        };

        // --- 日誌詳情視窗 (包含縮放功能與修復外套顯示) ---
        const LookDetailsModal = ({ isOpen, onClose, look, lookName, onRename }) => {
            if (!isOpen || !look) return null;

            const [isEditingName, setIsEditingName] = useState(false);
            const [tempName, setTempName] = useState(lookName);
            
            // [新增 1] 控制圖片是否正在放大的狀態
            const [isZooming, setIsZooming] = useState(false);

            const handleNameSave = () => {
                onRename(look.id, tempName);
                setIsEditingName(false);
            };
            
            // 內部小元件：顯示單品卡片 (支援多件顯示)
            const ItemCard = ({ item, label, icon }) => {
                if (!item) return null;
                const itemsList = Array.isArray(item) ? item : [item];
                if (itemsList.length === 0) return null;

                return (
                    <div className="bg-gray-50 rounded-lg border border-gray-100 p-2">
                        <p className="text-xs text-purple-600 font-bold flex items-center gap-1 mb-2">
                            <div className="w-3 h-3">{icon}</div> {label} 
                            {itemsList.length > 1 && <span className="text-[9px] bg-purple-100 px-1 rounded-full">x{itemsList.length}</span>}
                        </p>
                        <div className="space-y-2">
                            {itemsList.map((itm, idx) => (
                                <div key={idx} className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white rounded-md overflow-hidden flex-shrink-0 border border-gray-200">
                                        <img src={itm.src} className="w-full h-full object-cover" />
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-medium text-gray-800 truncate">{itm.name || `未命名單品 ${idx+1}`}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // [修改重點] 這裡的 return 結構改變了
            return (
                <>
                    {/* [新增 2] 如果 isZooming 為 true，就顯示全螢幕縮放視窗 */}
                    {isZooming && (
                        <ImageZoomModal 
                            src={look.src} 
                            onClose={() => setIsZooming(false)} 
                        />
                    )}

                    {/* 原本的詳細視窗內容 */}
                    <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" onClick={onClose}>
                        <div className="bg-white w-full max-w-4xl h-[100dvh] md:h-[80vh] rounded-none md:rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row" onClick={e => e.stopPropagation()}>
                            
                            {/* 左側圖片區 */}
                            <div className="w-full md:w-1/2 bg-gray-100 relative flex items-center justify-center h-[40%] md:h-full bg-contain bg-center bg-no-repeat">
                                {/* [修改 3] 加上 cursor-zoom-in 和 onClick 事件來觸發放大 */}
                                <img 
                                    src={look.src} 
                                    className="w-full h-full object-contain cursor-zoom-in hover:opacity-95 transition-opacity" 
                                    onClick={() => setIsZooming(true)}
                                />
                                <button onClick={onClose} className="absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full hover:bg-black/70 md:hidden">
                                    <div className="w-5 h-5"><Icons.X /></div>
                                </button>
                            </div>

                            {/* 右側資訊區 */}
                            <div className="w-full md:w-1/2 flex flex-col h-[60%] md:h-full bg-white">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            {isEditingName ? (
                                                <div className="flex items-center gap-1">
                                                    <input type="text" value={tempName} onChange={(e) => setTempName(e.target.value)} className="border rounded px-2 py-1 text-sm font-bold w-32" />
                                                    <button onClick={handleNameSave} className="text-green-600 hover:text-green-700 text-xs">OK</button>
                                                </div>
                                            ) : (
                                                <div className="flex items-center gap-2">
                                                    <h3 className="font-bold text-lg text-gray-800">{lookName}</h3>
                                                    <button onClick={() => setIsEditingName(true)} className="text-gray-400 hover:text-purple-600"><div className="w-4 h-4"><Icons.Edit /></div></button>
                                                </div>
                                            )}
                                        </div>
                                        <p className="text-xs text-gray-500">建立於: {look.createdAt ? new Date(look.createdAt.seconds * 1000).toLocaleString() : '未知時間'}</p>
                                    </div>
                                    <button onClick={onClose} className="hidden md:block p-2 hover:bg-gray-100 rounded-full"><div className="w-5 h-5 text-gray-500"><Icons.X /></div></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-20 md:pb-4">
                                    <div className="space-y-2">
                                        <h5 className="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">💇 髮型</h5>
                                        {look.items?.hairstyle ? <ItemCard item={look.items.hairstyle} label="髮型" icon={<Icons.Scissors />} /> : <div className="p-2 text-center text-xs text-gray-300 border border-dashed rounded-lg">無髮型紀錄</div>}
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-dashed border-gray-100">
                                        <h5 className="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">👕 服飾</h5>
                                        {/* [修改 4] 確保這裡包含 outerwear (外套) */}
                                        {look.items?.upper && <ItemCard item={look.items.upper} label="上身" icon={<Icons.Shirt />} />}
                                        {look.items?.outerwear && <ItemCard item={look.items.outerwear} label="外套" icon={<Icons.Jacket />} />}
                                        {look.items?.lower && <ItemCard item={look.items.lower} label="下身" icon={<Icons.Grid />} />}
                                        {look.items?.shoes && <ItemCard item={look.items.shoes} label="鞋子" icon={<Icons.Shoes />} />}
                                        {look.items?.accessory && <ItemCard item={look.items.accessory} label="配件" icon={<Icons.Watch />} />}
                                    </div>
                                </div>

                                <div className="p-4 border-t bg-gray-50 absolute bottom-0 w-full md:relative">
                                    <a href={look.src} download={`look-${look.id}.jpg`} className="w-full py-3 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-800 flex items-center justify-center gap-2 transition-colors">
                                        <div className="w-4 h-4"><Icons.Download /></div> 下載穿搭照
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };
        
        // --- 新增：圖片縮放檢視器 ---
        const ImageZoomModal = ({ src, onClose }) => {
            if (!src) return null;
            const [scale, setScale] = useState(1);
            
            // 簡單的點擊放大/縮小邏輯
            const toggleZoom = (e) => {
                e.stopPropagation();
                setScale(prev => prev === 1 ? 2.5 : 1);
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center overflow-hidden transition-opacity" onClick={onClose}>
                    <div className="relative w-full h-full flex items-center justify-center p-2">
                        <img 
                            src={src} 
                            className="transition-transform duration-300 ease-out cursor-zoom-in object-contain max-h-full max-w-full"
                            style={{ transform: `scale(${scale})` }}
                            onClick={toggleZoom}
                        />
                        <button onClick={onClose} className="absolute top-4 right-4 bg-white/10 text-white p-3 rounded-full backdrop-blur-md hover:bg-white/20 z-50">
                            <div className="w-6 h-6"><Icons.X /></div>
                        </button>
                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/50 text-white text-xs px-4 py-2 rounded-full backdrop-blur-sm pointer-events-none">
                            點擊圖片可放大 / 縮小
                        </div>
                    </div>
                </div>
            );
        };
        
        const AuthScreen = ({ isFirebaseReady }) => {
            const [isRegister, setIsRegister] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                if (!isFirebaseReady) { setError("尚未連線到 Firebase"); setLoading(false); return; }
                try {
                    const auth = window.Firebase.getAuth();
                    if (isRegister) {
                        const cred = await window.Firebase.createUserWithEmailAndPassword(auth, email, password);
                        await window.Firebase.updateProfile(cred.user, { displayName: name });
                    } else {
                        await window.Firebase.signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (err) {
                    let msg = err.message;
                    if (err.code === 'auth/invalid-email') msg = "Email 格式錯誤";
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') msg = "帳號或密碼錯誤";
                    if (err.code === 'auth/email-already-in-use') msg = "此 Email 已被註冊";
                    if (err.code === 'auth/weak-password') msg = "密碼太弱 (至少6位)";
                    setError(msg);
                    setLoading(false);
                }
            };

            const handleGoogleLogin = async () => {
                if (!isFirebaseReady) { setError("尚未連線到 Firebase"); return; }
                setLoading(true);
                try {
                    const auth = window.Firebase.getAuth();
                    const provider = new window.Firebase.GoogleAuthProvider();
                    await window.Firebase.signInWithPopup(auth, provider);
                } catch (err) { setError(err.message); setLoading(false); }
            };

            const handleAnonymousLogin = async () => {
                if (!isFirebaseReady) { setError("尚未連線到 Firebase"); return; }
                setLoading(true);
                try {
                    const auth = window.Firebase.getAuth();
                    await window.Firebase.signInAnonymously(auth);
                } catch (err) { setError(err.message); setLoading(false); }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-4">
                    <div className="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg">{loading ? <div className="animate-spin"><Icons.Loader /></div> : <Icons.User />}</div></div>
                        <h2 className="text-2xl font-bold text-center mb-2">虛擬試穿衣櫥</h2>
                        <p className="text-slate-400 text-center mb-6 text-sm">{isFirebaseReady ? (isRegister ? "註冊新帳號" : "登入您的衣櫥") : <span className="text-orange-400">等待 Firebase 連線...</span>}</p>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegister && <input type="text" placeholder="您的暱稱" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 focus:border-purple-500 outline-none" required />}
                            <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 focus:border-purple-500 outline-none" required />
                            <input type="password" placeholder="密碼" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 focus:border-purple-500 outline-none" required />
                            {error && <p className="text-red-400 text-sm text-center bg-red-900/20 p-2 rounded-lg">{error}</p>}
                            <button type="submit" disabled={loading} className={`w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 font-bold hover:shadow-lg transition-all ${loading ? 'opacity-50' : ''}`}>{loading ? '處理中...' : (isRegister ? '註冊' : '登入')}</button>
                        </form>
                        <div className="relative my-6"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-600"></div></div><div className="relative flex justify-center text-xs"><span className="px-2 bg-slate-800 text-slate-400">或使用</span></div></div>
                        <button type="button" onClick={handleGoogleLogin} disabled={loading} className="w-full py-3 rounded-xl bg-white text-slate-700 font-bold hover:bg-gray-100 transition-all flex items-center justify-center gap-2"><div className="w-5 h-5"><Icons.Google /></div> Google 登入</button>
                        <button type="button" onClick={handleAnonymousLogin} disabled={loading} className="w-full mt-3 py-3 rounded-xl bg-slate-700 text-slate-200 font-bold hover:bg-slate-600 transition-all flex items-center justify-center gap-2"><div className="w-5 h-5"><Icons.User /></div> 訪客登入</button>
                        <div className="mt-6 text-center text-sm text-slate-400">{isRegister ? "已經有帳號？" : "還沒有帳號？"} <button onClick={() => { setIsRegister(!isRegister); setError(''); }} className="ml-2 text-purple-400 hover:text-purple-300 font-bold underline">{isRegister ? "直接登入" : "立即註冊"}</button></div>
                    </div>
                </div>
            );
        };

        const VirtualWardrobe = () => {
            const [showSettings, setShowSettings] = useState(false);
            const [activeTab, setActiveTab] = useState('wardrobe');
            const [clothes, setClothes] = useState([]);
            const [users, setUsers] = useState([]);
            const [looks, setLooks] = useState([]);
            const [userTags, setUserTags] = useState([]); 
            const [userBrands, setUserBrands] = useState([]); 
            const [genStats, setGenStats] = useState({ count: 0, limit: 1 }); 
            const [user, setAuthUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [globalApiKey, setGlobalApiKey] = useState('');
            // [新增] 用於控制全螢幕縮放圖片的 State
            const [zoomImageSrc, setZoomImageSrc] = useState(null);
            
            // --- 核心修改：將 Slots 轉為 State 以支援動態新增 ---
            const [tryOnSlots, setTryOnSlots] = useState([
                { id: 'hairstyle', category: 'hairstyle', label: '髮型' },
                { id: 'upper', category: 'upper', label: '上身' },
                { id: 'outerwear', category: 'outerwear', label: '外套' },
                { id: 'lower', category: 'lower', label: '下身' },
                { id: 'shoes', category: 'shoes', label: '鞋子' },
                { id: 'accessory', category: 'accessory', label: '配件' }
            ]);

            // selectedItems 保持不變，它是一個物件，key 對應 slot.id
            const [selectedItems, setSelectedItems] = useState({ 
                upper: null, outerwear: null, lower: null, 
                accessory: null, hairstyle: null, shoes: null 
            }); 
            
            const [selectedUser, setSelectedUser] = useState(null);
            
            const [viewCategory, setViewCategory] = useState('all'); 
            const [uploadCategory, setUploadCategory] = useState('upper');
            const [viewSubCategory, setViewSubCategory] = useState('all');
            const [viewBrand, setViewBrand] = useState('all'); 
            const [viewTag, setViewTag] = useState('all'); 
            const [viewMode, setViewMode] = useState('grid'); 

            const [generatedResult, setGeneratedResult] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [isSelectorOpen, setIsSelectorOpen] = useState(false);
            const [currentSelectionSlot, setCurrentSelectionSlot] = useState(null);
            const [genMode, setGenMode] = useState('studio');
            const [customPromptText, setCustomPromptText] = useState('');
            const [focusMode, setFocusMode] = useState('full');

            const [isUploadModalOpen, setIsUploadModalOpen] = useState(false);
            const [uploadFile, setUploadFile] = useState(null); 
            const [editingItem, setEditingItem] = useState(null); 
            const [selectedLook, setSelectedLook] = useState(null);

            const fileInputRefCloth = useRef(null);
            const fileInputRefUser = useRef(null);

            useEffect(() => {
                // 當切換瀏覽分類時，同步更新上傳預設分類 (但這裡不再直接 setUploadCategory，改由 Modal 內部處理)
                setViewSubCategory('all'); setViewBrand('all'); setViewTag('all');   
            }, [viewCategory]);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!YOUR_FIREBASE_CONFIG.apiKey) return;
                    try {
                        let app; try { app = window.Firebase.initializeApp(YOUR_FIREBASE_CONFIG); } catch(e) { app = window.Firebase.getApp(); }
                        const auth = window.Firebase.getAuth(app);
                        window.Firebase.onAuthStateChanged(auth, (u) => { setAuthUser(u); setIsFirebaseReady(true); });
                    } catch (err) { console.error("Firebase Init Error:", err); }
                };
                if (window.Firebase) initFirebase();
            }, []); 

            useEffect(() => {
                if (!user || !isFirebaseReady) return;
                setIsSyncing(true);
                const db = window.Firebase.getFirestore();
                
                const fetchApiKey = async () => {
                    try {
                        const docRef = window.Firebase.doc(db, 'app_config', 'secrets');
                        const docSnap = await window.Firebase.getDoc(docRef);
                        if (docSnap.exists()) setGlobalApiKey(docSnap.data().gemini_key || '');
                    } catch (e) { }
                };
                fetchApiKey();

                const unsubSettings = window.Firebase.onSnapshot(window.Firebase.doc(db, 'users', user.uid, 'settings', 'config'), (doc) => {
                    if (doc.exists()) {
                        setUserTags(doc.data().tags || []);
                        setUserBrands(doc.data().brands || []); 
                    }
                });

                // --- 額度統計與每日歸零邏輯 ---
                const statsRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'stats');
                const unsubStats = window.Firebase.onSnapshot(statsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const today = new Date().toLocaleDateString('zh-TW'); // 取得今日日期字串
                        
                        // 檢查日期是否不同，如果不同則重置
                        if (data.lastReset !== today) {
                             // 修改：每天重置時，將 count 歸零，並且將 limit (額度) 也強制歸零
                             window.Firebase.setDoc(statsRef, { count: 0, limit: 0, lastReset: today }, { merge: true });
                        } 
                        
                        setGenStats({ 
                            // 如果日期是今天，使用 count，否則視為 0 (等待上面 setDoc 生效)
                            count: (data.lastReset === today) ? (data.count || 0) : 0, 
                            // 修改：原本 || 1 會導致 0 變成 1。改成允許 0。
                            limit: (data.limit !== undefined) ? data.limit : 0 
                        });
                    } else {
                        // 初始化
                        const today = new Date().toLocaleDateString('zh-TW');
                        // 修改：初始額度設為 0
                        window.Firebase.setDoc(statsRef, { count: 0, limit: 0, lastReset: today }, { merge: true });
                        setGenStats({ count: 0, limit: 0 });
                    }
                });

                const unsubClothes = window.Firebase.onSnapshot(window.Firebase.query(window.Firebase.collection(db, 'users', user.uid, 'clothes'), window.Firebase.orderBy('createdAt', 'desc')), (s) => setClothes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubUsers = window.Firebase.onSnapshot(window.Firebase.query(window.Firebase.collection(db, 'users', user.uid, 'models'), window.Firebase.orderBy('createdAt', 'desc')), (s) => setUsers(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubLooks = window.Firebase.onSnapshot(window.Firebase.query(window.Firebase.collection(db, 'users', user.uid, 'looks'), window.Firebase.orderBy('createdAt', 'desc')), (s) => { setLooks(s.docs.map(d => ({ id: d.id, ...d.data() }))); setIsSyncing(false); });
                
                return () => { unsubClothes(); unsubUsers(); unsubLooks(); unsubSettings(); unsubStats(); };
            }, [user, isFirebaseReady]);

            const saveApiKeyToCloud = async (key) => {
                if (!isFirebaseReady) return;
                try {
                    const db = window.Firebase.getFirestore();
                    await window.Firebase.setDoc(window.Firebase.doc(db, 'app_config', 'secrets'), { gemini_key: key }, { merge: true });
                    setGlobalApiKey(key);
                } catch (e) { alert("儲存失敗"); }
            };

            const handleRedeem = async (code) => {
                if (!isFirebaseReady) return false;
                try {
                    const db = window.Firebase.getFirestore();
                    const codeDoc = await window.Firebase.getDoc(window.Firebase.doc(db, 'app_config', 'codes'));
                    if (codeDoc.exists() && codeDoc.data().topup_password === code) {
                        await window.Firebase.updateDoc(window.Firebase.doc(db, 'users', user.uid, 'settings', 'stats'), {
                            limit: window.Firebase.increment(5)
                        });
                        return true;
                    }
                } catch (e) { console.error(e); }
                return false;
            };

            const handleAddUserTag = async (newTag) => {
                if (!isFirebaseReady || !user) return;
                try {
                    const db = window.Firebase.getFirestore();
                    const docRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'config');
                    await window.Firebase.setDoc(docRef, { tags: window.Firebase.arrayUnion(newTag) }, { merge: true });
                } catch (err) {}
            };

            const handleDeleteUserTag = async (tagToDelete) => {
                if (!isFirebaseReady || !user) return;
                if (!confirm(`確定要刪除標籤 "${tagToDelete}" 嗎？`)) return;
                try {
                    const db = window.Firebase.getFirestore();
                    const docRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'config');
                    await window.Firebase.updateDoc(docRef, { tags: window.Firebase.arrayRemove(tagToDelete) });
                } catch (err) {}
            };

            const handleAddUserBrand = async (newBrand) => {
                if (!isFirebaseReady || !user) return;
                try {
                    const db = window.Firebase.getFirestore();
                    const docRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'config');
                    await window.Firebase.setDoc(docRef, { brands: window.Firebase.arrayUnion(newBrand) }, { merge: true });
                } catch (err) {}
            };
            
            const handleDeleteUserBrand = async (brandToDelete) => {
                if (!isFirebaseReady || !user) return;
                if (!confirm(`確定要刪除品牌 "${brandToDelete}" 嗎？`)) return;
                try {
                    const db = window.Firebase.getFirestore();
                    const docRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'config');
                    await window.Firebase.updateDoc(docRef, { brands: window.Firebase.arrayRemove(brandToDelete) });
                } catch (err) { console.error(err); }
            };

            const handleFileSelect = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                if (type === 'user') {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const compressedBase64 = await compressImage(reader.result, 800, 0.6);
                        const defaultName = file.name.replace(/\.[^/.]+$/, "");
                        uploadToFirebase({ name: defaultName, src: compressedBase64 }, 'models');
                    };
                    reader.readAsDataURL(file);
                } else {
                    setUploadFile(file);
                    setEditingItem(null);
                    setIsUploadModalOpen(true);
                }
            };

            const handleEditItem = (item) => {
                setUploadFile(null);
                setEditingItem(item);
                setIsUploadModalOpen(true);
            };

            // --- 修改版：上傳/編輯單品 (包含自動同步日誌名稱功能) ---
            const handleConfirmUpload = async (metadata) => {
                let base64Src = editingItem?.src;
                
                // 1. 處理圖片壓縮
                if (uploadFile) {
                    const reader = new FileReader();
                    const promise = new Promise(resolve => { reader.onloadend = () => resolve(reader.result); });
                    reader.readAsDataURL(uploadFile);
                    const rawBase64 = await promise;
                    base64Src = await compressImage(rawBase64, 800, 0.6);
                }
                
                if (!base64Src && !editingItem) return; // 沒有圖片且不是編輯模式
                if (!base64Src && editingItem) base64Src = editingItem.src; // 編輯模式但沒換圖

                const collectionName = 'clothes';
                
                // ----------------------------------------------------
                //  Firebase 雲端模式
                // ----------------------------------------------------
                if (isFirebaseReady && user) {
                    try {
                        const db = window.Firebase.getFirestore();
                        
                        if (editingItem) {
                            // A. 更新單品本身
                            const clothRef = window.Firebase.doc(db, 'users', user.uid, collectionName, editingItem.id);
                            await window.Firebase.updateDoc(clothRef, { ...metadata, src: base64Src });

                            // B. [新增] 自動同步邏輯：找出所有用到這件單品的日誌並更新名稱
                            // 注意：如果您日誌非常多(數千篇)，這可能會消耗較多讀寫次數，但個人使用完全沒問題
                            const looksRef = window.Firebase.collection(db, 'users', user.uid, 'looks');
                            const looksSnapshot = await window.Firebase.getDocs(looksRef);
                            const batch = window.Firebase.writeBatch(db);
                            let batchCount = 0;

                            looksSnapshot.forEach((doc) => {
                                const lookData = doc.data();
                                let isLookChanged = false;
                                const newItems = { ...lookData.items };

                                // 遞迴檢查並更新名稱的輔助函式
                                const checkAndUpdate = (entry) => {
                                    if (!entry) return entry;
                                    if (Array.isArray(entry)) {
                                        return entry.map(item => {
                                            if (item.id === editingItem.id && item.name !== metadata.name) {
                                                isLookChanged = true;
                                                return { ...item, name: metadata.name }; // 更新名稱
                                            }
                                            return item;
                                        });
                                    } else {
                                        if (entry.id === editingItem.id && entry.name !== metadata.name) {
                                            isLookChanged = true;
                                            return { ...entry, name: metadata.name }; // 更新名稱
                                        }
                                        return entry;
                                    }
                                };

                                // 掃描所有部位
                                ['upper', 'outerwear', 'lower', 'shoes', 'accessory', 'hairstyle'].forEach(cat => {
                                    if (newItems[cat]) newItems[cat] = checkAndUpdate(newItems[cat]);
                                });

                                // 如果有變動，加入批次更新
                                if (isLookChanged) {
                                    batch.update(doc.ref, { items: newItems });
                                    batchCount++;
                                }
                            });

                            if (batchCount > 0) {
                                await batch.commit();
                                console.log(`已自動同步更新了 ${batchCount} 篇日誌的單品名稱`);
                            }

                        } else {
                            // C. 新增單品 (不需要同步日誌)
                            await window.Firebase.addDoc(window.Firebase.collection(db, 'users', user.uid, collectionName), { ...metadata, src: base64Src, createdAt: window.Firebase.serverTimestamp() });
                        }
                    } catch (err) { 
                        alert("操作失敗: " + err.message); 
                        console.error(err);
                    }
                } 
                // ----------------------------------------------------
                //  本地模式 (訪客)
                // ----------------------------------------------------
                else {
                    const newItem = { id: editingItem ? editingItem.id : Date.now(), src: base64Src, ...metadata };
                    
                    if (editingItem) {
                        // 更新衣櫥
                        setClothes(clothes.map(c => c.id === newItem.id ? newItem : c));
                        
                        // [新增] 本地模式同步更新 Looks
                        setLooks(prevLooks => prevLooks.map(look => {
                            let isLookChanged = false;
                            const newItems = { ...look.items };
                            
                            const checkAndUpdateLocal = (entry) => {
                                if (!entry) return entry;
                                if (Array.isArray(entry)) {
                                    return entry.map(item => {
                                        if (item.id === editingItem.id) {
                                            isLookChanged = true;
                                            return { ...item, name: metadata.name };
                                        }
                                        return item;
                                    });
                                } else {
                                    if (entry.id === editingItem.id) {
                                        isLookChanged = true;
                                        return { ...entry, name: metadata.name };
                                    }
                                    return entry;
                                }
                            };

                            ['upper', 'outerwear', 'lower', 'shoes', 'accessory', 'hairstyle'].forEach(cat => {
                                if (newItems[cat]) newItems[cat] = checkAndUpdateLocal(newItems[cat]);
                            });

                            return isLookChanged ? { ...look, items: newItems } : look;
                        }));

                    } else {
                        setClothes([newItem, ...clothes]);
                    }
                }
            };

            const uploadToFirebase = async (data, collectionName) => {
                if (isFirebaseReady && user) {
                    try {
                        const db = window.Firebase.getFirestore();
                        await window.Firebase.addDoc(window.Firebase.collection(db, 'users', user.uid, collectionName), { ...data, createdAt: window.Firebase.serverTimestamp() });
                    } catch (err) { alert("上傳失敗"); }
                } else {
                    setUsers([{ id: Date.now(), ...data }, ...users]);
                }
            };

            const handleSaveLook = async () => {
                if (!generatedResult) return;
                let compressedResult = generatedResult;
                try { compressedResult = await compressImage(generatedResult, 800, 0.6); } catch (e) {}
                
                const defaultName = `穿搭 ${new Date().toLocaleDateString()}`;
                const lookName = prompt("輸入穿搭名稱:", defaultName) || defaultName;

                const prepareItemData = (item) => {
                    if (!item) return null;
                    return { id: item.id, src: item.src, name: item.name };
                };
                
                // 動態收集所有使用到的 items
                const itemsUsed = { 
                    user: selectedUser ? { id: selectedUser.id, src: selectedUser.src, name: selectedUser.name } : null,
                };
                
                // 遍歷 tryOnSlots 來保存所有選中的單品
                tryOnSlots.forEach(slot => {
                    if (selectedItems[slot.id]) {
                        itemsUsed[slot.id] = prepareItemData(selectedItems[slot.id]);
                    }
                });

                const lookData = { 
                    name: lookName,
                    src: compressedResult, 
                    items: itemsUsed, 
                    createdAt: isFirebaseReady ? window.Firebase.serverTimestamp() : new Date() 
                };
                
                if (isFirebaseReady && user) {
                    try {
                        const db = window.Firebase.getFirestore();
                        await window.Firebase.addDoc(window.Firebase.collection(db, 'users', user.uid, 'looks'), lookData);
                        alert("❤️ 已保存到雲端日誌！");
                    } catch (err) { 
                        if (err.code === 'invalid-argument' && err.message.includes('exceeds the maximum allowed size')) alert("保存失敗：圖片太大");
                        else alert("保存失敗: " + err.message); 
                    }
                } else {
                    const newLook = { id: Date.now(), ...lookData };
                    setLooks([newLook, ...looks]);
                    alert("❤️ 已保存到本地日誌");
                }
            };
            
            const handleRenameLook = async (id, currentName) => {
                const newName = prompt("編輯穿搭名稱:", currentName);
                if (newName && newName !== currentName) {
                    if (isFirebaseReady && user) {
                         try {
                            const db = window.Firebase.getFirestore();
                            await window.Firebase.updateDoc(window.Firebase.doc(db, 'users', user.uid, 'looks', id), { name: newName });
                        } catch (err) { alert("更名失敗"); }
                    } else {
                        setLooks(looks.map(l => l.id === id ? { ...l, name: newName } : l));
                    }
                }
            };

            const handleDelete = async (id, type) => {
                if (isFirebaseReady && user) {
                    const db = window.Firebase.getFirestore();
                    let collectionName = type === 'cloth' ? 'clothes' : (type === 'user' ? 'models' : 'looks');
                    await window.Firebase.deleteDoc(window.Firebase.doc(db, 'users', user.uid, collectionName, id));
                } else {
                    if (type === 'cloth') setClothes(clothes.filter(c => c.id !== id));
                    else if (type === 'user') setUsers(users.filter(u => u.id !== id));
                    else setLooks(looks.filter(l => l.id !== id));
                }
                if (type === 'cloth') { const n = { ...selectedItems }; Object.keys(n).forEach(k => { if (n[k]?.id === id) n[k] = null; }); setSelectedItems(n); }
                else if (type === 'user' && selectedUser?.id === id) setSelectedUser(null);
                if (type === 'look' && selectedLook?.id === id) setSelectedLook(null);
            };

            // ... (handleDelete 函式之後) ...

            // [新增] 還原穿搭到試穿區
            const handleRestoreLook = (look) => {
                if (!look) return;

                // 1. 還原模特兒
                if (look.items?.user) {
                    setSelectedUser(look.items.user);
                }

                // 2. 還原選定的衣物
                // 為了避免混亂，先建立一個乾淨的 state，只填入 Look 中有的項目
                const newSelectedItems = { ...selectedItems };
                
                // 先將所有欄位清空 (可選：如果您希望保留未覆蓋的項目，可拿掉這段迴圈)
                Object.keys(newSelectedItems).forEach(key => {
                    newSelectedItems[key] = null;
                });

                // 填入 Look 中的項目
                if (look.items) {
                    Object.keys(look.items).forEach(key => {
                        if (key !== 'user' && look.items[key]) {
                            // 直接將儲存的 item 還原回去
                            newSelectedItems[key] = look.items[key];
                        }
                    });
                }
                setSelectedItems(newSelectedItems);

                // 3. 跳轉到試穿頁面並關閉 Modal
                setActiveTab('studio');
                setSelectedLook(null);
                
                // 提示使用者
                // 可以選擇性加入：alert("已將穿搭帶入試穿間！");
            };

            // ... (handleAddSlot 函式之前) ...

            // --- 新增：處理增加欄位的函式 ---
            const handleAddSlot = (category, labelPrefix) => {
                const newId = `${category}_${Date.now()}`; // 產生唯一 ID
                const newSlot = { 
                    id: newId, 
                    category: category, 
                    label: `${labelPrefix} ${tryOnSlots.filter(s => s.category === category).length + 1}` 
                };
                
                // 插入到適當位置 (例如：新增的上身放在所有上身之後，但在下身之前)
                const lastIndex = tryOnSlots.findLastIndex(s => s.category === category);
                const insertIndex = lastIndex >= 0 ? lastIndex + 1 : tryOnSlots.length;
                
                const newSlots = [...tryOnSlots];
                newSlots.splice(insertIndex, 0, newSlot);
                setTryOnSlots(newSlots);
            };

            // --- 新增：處理刪除欄位的函式 (選擇性功能) ---
            const handleRemoveSlot = (slotId) => {
                setTryOnSlots(prev => prev.filter(s => s.id !== slotId));
                setSelectedItems(prev => {
                    const next = { ...prev };
                    delete next[slotId];
                    return next;
                });
            };

            const handleGenerateClick = async () => {
                if (!selectedUser) return;

                if (genStats.count >= genStats.limit) {
                    alert(`🔒 額度已滿 (${genStats.count}/${genStats.limit})。\n\n請在設定中輸入代碼以獲取更多額度。`);
                    return;
                }

                setIsGenerating(true); setGeneratedResult(null); setErrorMsg('');
                try {
                    // 修改這裡：傳入最後一個 callback 函式來接收 Prompt
                    const result = await generateTryOnImage(
                        selectedUser.src, 
                        selectedItems, 
                        globalApiKey, 
                        genMode, 
                        customPromptText, 
                        focusMode, 
                        tryOnSlots,
                        (debugText) => {
                            // 這裡收到 Prompt 後，直接填入自訂欄位
                            setCustomPromptText(debugText);
                            // 如果您希望生成後自動跳轉到「自訂指令」分頁以便觀看，可取消下行註解：
                            // setGenMode('custom'); 
                        }
                    );

                    setGeneratedResult(result);
                    
                    if (isFirebaseReady) {
                        const db = window.Firebase.getFirestore();
                        const statsRef = window.Firebase.doc(db, 'users', user.uid, 'settings', 'stats');
                        await window.Firebase.updateDoc(statsRef, { count: window.Firebase.increment(1) });
                    }
                } catch (err) { setErrorMsg(err.message); } finally { setIsGenerating(false); }
            };
            
            const handleDownload = (url, name) => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); };
            const getCategoryLabel = (cat) => { switch(cat) { case 'all': return { text: '全部', icon: <Icons.Grid /> }; case 'upper': return { text: '上身', icon: <Icons.Shirt /> }; case 'outerwear': return { text: '外套', icon: <Icons.Jacket /> }; case 'lower': return { text: '下身', icon: <Icons.Layer /> }; case 'accessory': return { text: '配件', icon: <Icons.Watch /> }; case 'hairstyle': return { text: '髮型', icon: <Icons.Scissors /> }; case 'shoes': return { text: '鞋子', icon: <Icons.Shoes /> }; default: return { text: '其他', icon: <Icons.Shirt /> }; }};
            const handleImageError = (e) => { e.target.onerror = null; e.target.src = "https://placehold.co/400x600/e2e8f0/94a3b8?text=Image+Error"; };
            const handleRenameModel = async (id, currentName) => { const newName = prompt("編輯名稱:", currentName); if (newName && newName !== currentName) { if (isFirebaseReady && user) { try { const db = window.Firebase.getFirestore(); await window.Firebase.updateDoc(window.Firebase.doc(db, 'users', user.uid, 'models', id), { name: newName }); } catch (err) { alert("失敗"); } } else { setUsers(users.map(u => u.id === id ? { ...u, name: newName } : u)); } } };
            const getLatestItemInfo = (snapshotItem, type) => { if (!snapshotItem) return null; if (type === 'user') { const current = users.find(u => u.id === snapshotItem.id); return current ? { ...current, src: snapshotItem.src } : snapshotItem; } else { const current = clothes.find(c => c.id === snapshotItem.id); return current ? { ...current, src: snapshotItem.src } : snapshotItem; } };

            if (!user) return <AuthScreen isFirebaseReady={isFirebaseReady} />;
            
            const allBrands = Array.from(new Set([...DEFAULT_BRANDS, ...(userBrands || [])]));

            const ListViewItem = ({ item, type, onDelete, onEdit }) => (
                <div className="flex items-center gap-4 p-3 bg-white rounded-xl border border-gray-100 shadow-sm">
                    <img src={item.src} className="w-16 h-16 rounded-md object-cover flex-shrink-0" onError={handleImageError} />
                    <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between">
                            <h4 className="font-bold text-gray-800 truncate">{item.name}</h4>
                            <div className="flex gap-2">
                                <button onClick={(e) => { e.stopPropagation(); onEdit(item); }} className="text-gray-400 hover:text-purple-600"><div className="w-4 h-4"><Icons.Edit /></div></button>
                                <button onClick={(e) => { e.stopPropagation(); onDelete(item.id, type); }} className="text-gray-400 hover:text-red-600"><div className="w-4 h-4"><Icons.Trash /></div></button>
                            </div>
                        </div>
                        {type === 'cloth' && (
                            <div className="text-xs text-gray-500 mt-1 flex flex-wrap gap-2">
                                <span className="bg-gray-100 px-2 py-0.5 rounded">{CLOTH_CATEGORIES[item.category]?.label || item.category}</span>
                                {item.subCategory && <span className="bg-gray-100 px-2 py-0.5 rounded">{item.subCategory}</span>}
                                {item.brand && <span className="bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-medium">{item.brand}</span>}
                            </div>
                        )}
                        {item.tags && item.tags.length > 0 && (<div className="flex gap-1 mt-2 overflow-x-auto scrollbar-hide">{item.tags.map(tag => <span key={tag} className="text-[10px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded">#{tag}</span>)}</div>)}
                    </div>
                </div>
            );
            
            // --- 修正版 LookListViewItem ---
            const LookListViewItem = ({ look, onDelete, onRename, onSelect }) => {
                 const hairstyle = getLatestItemInfo(look.items?.hairstyle, 'cloth');
                 const clothingItems = [];
                 ['upper', 'outerwear', 'lower', 'shoes', 'accessory'].forEach(cat => {
                     const info = getLatestItemInfo(look.items?.[cat], 'cloth');
                     if (Array.isArray(info)) clothingItems.push(...info);
                     else if (info) clothingItems.push(info);
                 });
                 
                 return (
                    // [修改 2] className 改為 flex-row (手機版也橫向排列)，並固定圖片寬度
                    <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-3 flex flex-row gap-3 h-32 md:h-auto overflow-hidden">
                        {/* 圖片區域：固定寬度，確保手機版不會變上下堆疊 */}
                        <div className="relative w-24 md:w-32 aspect-[3/4] md:aspect-square flex-shrink-0 cursor-pointer bg-gray-100 rounded-lg overflow-hidden" onClick={() => onSelect(look)}>
                            <img src={look.src} className="w-full h-full object-cover" onError={handleImageError} />
                        </div>
                        
                        <div className="flex-1 min-w-0 flex flex-col justify-between py-1">
                            <div className="flex justify-between items-start">
                                <div className="min-w-0 flex-1 mr-2">
                                    <div className="flex items-center gap-2">
                                        <h3 className="font-bold text-base text-gray-800 truncate">{look.name || '未命名穿搭'}</h3>
                                        {/* [修改 3] 編輯按鈕：加上 e.stopPropagation 避免觸發彈窗，並確保 onRename 存在 */}
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); if(onRename) onRename(look.id, look.name); }} 
                                            className="text-gray-400 hover:text-purple-600 p-1 flex-shrink-0"
                                        >
                                            <div className="w-4 h-4"><Icons.Edit /></div>
                                        </button>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-0.5">{look.createdAt ? new Date(look.createdAt.seconds * 1000).toLocaleDateString() : '剛剛'}</p>
                                </div>
                                <button 
                                    onClick={(e) => { e.stopPropagation(); if(onDelete) onDelete(look.id, 'look'); }} 
                                    className="text-gray-400 hover:text-red-600 p-1 flex-shrink-0"
                                >
                                    <div className="w-4 h-4"><Icons.Trash /></div>
                                </button>
                            </div>

                            {/* 簡化版內容展示：手機版只顯示一行圖示 */}
                            <div className="mt-2 flex gap-1 overflow-hidden opacity-70">
                                {clothingItems.slice(0, 4).map((item, idx) => (
                                    <div key={idx} className="w-6 h-6 rounded-md bg-gray-100 border border-gray-200 overflow-hidden flex-shrink-0">
                                        <img src={item.src} className="w-full h-full object-cover" />
                                    </div>
                                ))}
                                {clothingItems.length > 4 && <div className="w-6 h-6 flex items-center justify-center text-[9px] text-gray-400 bg-gray-50">+{clothingItems.length - 4}</div>}
                            </div>
                        </div>
                    </div>
                 );
            };

            return (
                <div className="flex flex-col h-screen bg-gray-50 overflow-hidden">
                    <header className="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
                        <div className="flex items-center gap-2"><div className="w-8 h-8 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">V</div><h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-pink-600">Virtual Wardrobe</h1></div>
                        <div className="flex items-center gap-3"><div className="text-xs text-gray-400 hidden md:flex items-center gap-1">{isFirebaseReady ? (isSyncing ? "同步中..." : <><span className="text-green-500">●</span> {user.displayName || user.email}</>) : <span className="text-orange-400">本地模式</span>}</div><button onClick={() => setShowSettings(true)} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><div className="w-5 h-5 text-gray-500"><Icons.Settings /></div></button></div>
                    </header>
                    <main className="flex-1 overflow-y-auto p-4 md:p-6 max-w-5xl mx-auto w-full pb-24 z-0">
                        <div className="flex bg-white rounded-xl p-1 shadow-sm mb-6 sticky top-0 z-40 ring-1 ring-gray-100">{[{ id: 'wardrobe', icon: <Icons.Grid />, label: '衣櫥' }, { id: 'user', icon: <Icons.User />, label: '模特兒' }, { id: 'studio', icon: <Icons.Sparkles />, label: '試穿' }, { id: 'lookbook', icon: <Icons.BookHeart />, label: '日誌' }].map(tab => (<button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2 ${activeTab === tab.id ? 'bg-purple-100 text-purple-700' : 'text-gray-500 hover:bg-gray-50'}`}><div className="w-5 h-5">{tab.icon}</div> <span className="hidden md:inline">{tab.label}</span></button>))}</div>
                        
                        {activeTab === 'wardrobe' && (
                            <div className="animate-fade-in">
                                <div className="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div className="flex bg-gray-100 rounded-lg p-1 overflow-x-auto max-w-[70%] md:max-w-none scrollbar-hide">
                                        {['all', 'upper', 'outerwear', 'lower', 'shoes', 'accessory', 'hairstyle'].map(type => (
                                            <button key={type} onClick={() => setViewCategory(type)} className={`px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap transition-colors ${viewCategory === type ? 'bg-white shadow-sm text-purple-600' : 'text-gray-500 hover:text-gray-700'}`}>{CLOTH_CATEGORIES[type]?.label || '全部'}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex items-center gap-2 w-full md:w-auto">
                                            {viewCategory !== 'all' && (<select value={viewSubCategory} onChange={e => setViewSubCategory(e.target.value)} className="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-medium text-gray-600 outline-none"><option value="all">所有種類</option>{CLOTH_CATEGORIES[viewCategory].types.map(t => <option key={t} value={t}>{t}</option>)}</select>)}
                                            <select value={viewBrand} onChange={e => setViewBrand(e.target.value)} className="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-medium text-gray-600 outline-none"><option value="all">所有品牌</option>{allBrands.map(b => <option key={b} value={b}>{b}</option>)}</select>
                                            <select value={viewTag} onChange={e => setViewTag(e.target.value)} className="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-medium text-gray-600 outline-none"><option value="all">所有標籤</option>{userTags.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                        </div>
                                        <button onClick={() => setViewMode(viewMode === 'grid' ? 'list' : 'grid')} className="p-2 bg-gray-100 rounded-lg text-gray-600 hover:bg-gray-200"><div className="w-5 h-5">{viewMode === 'grid' ? <Icons.List /> : <Icons.Grid />}</div></button>
                                        <button onClick={() => fileInputRefCloth.current.click()} className="flex items-center justify-center gap-2 px-6 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800 whitespace-nowrap transition-colors"><div className="w-4 h-4"><Icons.Upload /></div> 新增單品</button>
                                        <input type="file" ref={fileInputRefCloth} className="hidden" accept="image/*" onChange={(e) => handleFileSelect(e, 'cloth')} />
                                    </div>
                                </div>
                                {viewMode === 'grid' ? (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pb-10">
                                        {clothes.filter(item => {
                                            const catMatch = viewCategory === 'all' || item.category === viewCategory;
                                            const subMatch = viewSubCategory === 'all' || item.subCategory === viewSubCategory;
                                            const brandMatch = viewBrand === 'all' || item.brand === viewBrand;
                                            const tagMatch = viewTag === 'all' || (item.tags && item.tags.includes(viewTag));
                                            return catMatch && subMatch && brandMatch && tagMatch;
                                        }).map((item) => (
                                            <div key={item.id} className="group relative aspect-square bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm transition-all hover:shadow-md">
                                                <img src={item.src} onError={handleImageError} className="w-full h-full object-cover" />
                                                <div className="absolute top-2 left-2 flex flex-col gap-1 items-start max-w-[80%]">
